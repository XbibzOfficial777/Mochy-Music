name: Xbibz signed ARM GMS releases

on:
  push:
    branches:
      - mochy-xbibz
      - xbibz-issue-features
      # Test a release commit before advancing the stable branch or creating its tag.
      - xbibz-dual-abi-verify
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and verify signed ${{ matrix.abi }} APK
    if: github.repository == 'XbibzOfficial777/Mochy-Music'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            flavor: arm64Gms
            task: assembleArm64GmsRelease
          - abi: armeabi-v7a
            flavor: armeabiGms
            task: assembleArmeabiGmsRelease
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Restore and validate release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MOCHY_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOCHY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCHY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCHY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Signing keystore secret is missing}"
          : "${STORE_PASSWORD:?Store password secret is missing}"
          : "${KEY_ALIAS:?Key alias secret is missing}"
          : "${KEY_PASSWORD:?Key password secret is missing}"
          umask 077
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore
          actual="$(keytool -list -v -storetype PKCS12 -keystore app/keystore/release.keystore \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          trusted="$(tr -d '[:space:]' < .github/release-certificate.sha256)"
          test -n "$actual" && test "$actual" = "$trusted"
          echo 'Release key matches the previously distributed Bibz certificate.'
      - name: Build optimized non-debuggable GMS release
        env:
          GRADLE_TASK: ${{ matrix.task }}
          STORE_PASSWORD: ${{ secrets.MOCHY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCHY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCHY_RELEASE_KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew "$GRADLE_TASK" -PcompressNativeLibs --no-configuration-cache --console=plain --warning-mode summary
      - name: Verify ABI, ELF libraries, manifest, version and signing
        env:
          ABI: ${{ matrix.abi }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find "app/build/outputs/apk/$FLAVOR/release" -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          python3 .github/scripts/verify_release_native.py "$apk" "$ABI"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging "$apk" > /tmp/apk-badging.txt
          grep -q "package: name='com.mochyy.mochymusic'" /tmp/apk-badging.txt
          grep -Fx "sdkVersion:'24'" /tmp/apk-badging.txt
          grep -Fx "native-code: '$ABI'" /tmp/apk-badging.txt
          if grep -q 'application-debuggable' /tmp/apk-badging.txt; then
            echo 'Refusing a debuggable APK' >&2
            exit 1
          fi
          "$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/apk-manifest.txt
          if grep -Eq 'IssueSmokeActivity|LatestIssuesSmokeActivity|LanguageSmokeActivity' /tmp/apk-manifest.txt; then
            echo 'Refusing an APK containing debug-only test fixtures' >&2
            exit 1
          fi
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apk-certificate.txt
          grep -qx 'Number of signers: 1' /tmp/apk-certificate.txt
          actual="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apk-certificate.txt | tr '[:upper:]' '[:lower:]' | sort -u)"
          trusted="$(tr -d '[:space:]' < .github/release-certificate.sha256)"
          test -n "$actual" && test "$actual" = "$trusted"
          version="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" /tmp/apk-badging.txt | head -1)"
          code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" /tmp/apk-badging.txt | head -1)"
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]
          [[ "$code" =~ ^[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          mkdir -p release-assets
          filename="Mochy-Music-v${version}-${ABI}-gms.apk"
          cp "$apk" "release-assets/$filename"
          (cd release-assets && sha256sum "$filename" > "SHA256SUMS-${ABI}.txt")
          ABI="$ABI" VERSION="$version" CODE="$code" CERT="$actual" python3 - <<'PY'
          import json, os
          from pathlib import Path
          abi = os.environ['ABI']
          data = {
              'abi': abi,
              'applicationId': 'com.mochyy.mochymusic',
              'versionName': os.environ['VERSION'],
              'versionCode': int(os.environ['CODE']),
              'minSdk': 24,
              'signerSha256': os.environ['CERT'],
          }
          Path(f'release-assets/metadata-{abi}.json').write_text(json.dumps(data, sort_keys=True) + '\n')
          PY
          ls -lh release-assets/
      - name: Keep verified APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochy-release-${{ matrix.abi }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material from runner
        if: always()
        run: rm -f app/keystore/release.keystore

  publish:
    name: Verify both ABIs and publish release
    needs: build
    if: github.repository == 'XbibzOfficial777/Mochy-Music' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: mochy-release-*
          path: release-assets
          merge-multiple: true
      - name: Verify paired APKs and checksums
        run: python3 .github/scripts/verify_dual_artifacts.py release-assets --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub Release without replacing an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; leaving its assets unchanged.'
            exit 0
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          Unofficial Xbibz release for Android 7.0 or newer, with Google Cast support.

          Download **arm64-v8a** for 64-bit ARM devices, or **armeabi-v7a** for 32-bit ARMv7 devices. Both APKs are optimized, non-debuggable, and signed with the same Bibz release key. The app selects future fork updates for its installed architecture.

          App language may follow the device or be chosen in Settings → General → App language; missing translations fall back to English. Existing translations and some older hardcoded screens remain incomplete, and RTL layout is not yet supported. Liquid Glass remains exclusive to this fork.

          This fork uses a different signing key from official Mochy Music and cannot directly update an official installation. Back up or export data before uninstalling; app data may otherwise be lost. Some newer devices do not support 32-bit apps, so use the 64-bit APK on those devices.

          Builds and emulator tests do not replace testing on physical devices or real accounts. Availability of media, decoders, Cast receivers and third-party services varies.
          NOTES
          if [ -z "$LASTFM_API_KEY" ] || [ -z "$LASTFM_SECRET" ]; then
            printf '\nLast.fm credentials are not configured in this build.\n' >> /tmp/release-notes.md
          fi
          if [ -z "$DISCORD_CLIENT_ID" ]; then
            printf '\nDiscord client ID is not configured in this build.\n' >> /tmp/release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/*.apk release-assets/SHA256SUMS.txt \
            --verify-tag --title "Mochy Music $GITHUB_REF_NAME · ARM GMS" --notes-file /tmp/release-notes.md
