name: Signed Bibz language runtime validation (temporary)
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful signed build whose identical sources produced the APK
        required: true
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    name: Signed arm64 app language (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact release build source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          git cat-file -e "$sha^{commit}"
          git diff --exit-code "$sha" "$GITHUB_SHA" -- . ':(exclude).github/**'
          echo "Signed artifact source: $sha"
      - uses: actions/download-artifact@v4
        with:
          name: mochy-arm64-gms-release
          path: language-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify downloaded APK checksum
        run: cd language-apk && sha256sum --check SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/signed-language-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-language-evidence-api-${{ matrix.api }}
          path: |
            language-*.txt
            language-*.xml
            language-*.png
          if-no-files-found: warn
