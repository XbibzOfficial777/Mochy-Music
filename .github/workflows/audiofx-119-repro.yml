name: Original Audio FX issue 119 reproduction
on:
  push:
    branches: [ci/original-audiofx-119-repro]
  workflow_dispatch:
jobs:
  original-release:
    name: Original release on API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v6
      - name: Download the official 8.3.2 universal FOSS APK
        run: |
          curl --fail --location --retry 3 'https://github.com/realidkroo/Mochy-Music/releases/download/Mochy-8.3.2/app-universal-foss-release.apk' -o official.apk
          echo '828dd521a27cdd4d4d505f2e9e492d900fb3525df382145e1e99f897d907a15c  official.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual controls in the official APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: false
          script: bash .github/scripts/audiofx-119-repro.sh
      - name: Upload UI and preference snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audiofx-119-original-api-${{ matrix.api }}
          path: audiofx-repro/
          if-no-files-found: warn
          retention-days: 7
