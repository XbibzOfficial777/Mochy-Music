name: Signed three-build release runtime validation (temporary)
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Signed three-build run with identical application sources'
        required: true
      abi_filter:
        description: 'Which ABI to validate'
        type: choice
        options: [all, arm64, armv7, universal]
        default: all
      scenario:
        description: 'Language upgrade or offline playback'
        type: choice
        options: [language, playback, fixture]
        default: language
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.abi_filter == 'arm64' && '[{"abi":"arm64-v8a","api":30,"emulator_arch":"x86_64","runtime":"arm64-v8a","oldabi":"arm64-v8a"},{"abi":"arm64-v8a","api":35,"emulator_arch":"x86_64","runtime":"arm64-v8a","oldabi":"arm64-v8a"}]' || inputs.abi_filter == 'armv7' && '[{"abi":"armeabi-v7a","api":30,"emulator_arch":"x86","runtime":"armeabi-v7a","oldabi":"armeabi-v7a"},{"abi":"armeabi-v7a","api":30,"emulator_arch":"x86_64","runtime":"armeabi-v7a","oldabi":"armeabi-v7a"}]' || inputs.abi_filter == 'universal' && '[{"abi":"universal","api":30,"emulator_arch":"x86","runtime":"x86","oldabi":"armeabi-v7a"},{"abi":"universal","api":35,"emulator_arch":"x86_64","runtime":"x86_64","oldabi":"arm64-v8a"}]' || '[{"abi":"arm64-v8a","api":30,"emulator_arch":"x86_64","runtime":"arm64-v8a","oldabi":"arm64-v8a"},{"abi":"arm64-v8a","api":35,"emulator_arch":"x86_64","runtime":"arm64-v8a","oldabi":"arm64-v8a"},{"abi":"armeabi-v7a","api":30,"emulator_arch":"x86","runtime":"armeabi-v7a","oldabi":"armeabi-v7a"},{"abi":"armeabi-v7a","api":30,"emulator_arch":"x86_64","runtime":"armeabi-v7a","oldabi":"armeabi-v7a"},{"abi":"universal","api":30,"emulator_arch":"x86","runtime":"x86","oldabi":"armeabi-v7a"},{"abi":"universal","api":35,"emulator_arch":"x86_64","runtime":"x86_64","oldabi":"arm64-v8a"}]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the build used identical application sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$sha^{commit}"
          git diff --exit-code "$sha" "$GITHUB_SHA" -- . ':(exclude).github/**'
          echo "Verified identical application sources: $sha"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.scenario == 'fixture' && 'app-universal-gms-debug' || format('mochy-release-{0}', matrix.abi) }}
          path: language-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify the exact signed artifact
        if: inputs.scenario != 'fixture'
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          (cd language-apk && sha256sum --check "SHA256SUMS-$TARGET_ABI.txt")
          mapfile -t apks < <(find language-apk -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          python3 .github/scripts/verify_release_native.py "${apks[0]}" "$TARGET_ABI"
      - name: Download and verify the previous public .5 release
        if: inputs.scenario != 'fixture'
        env:
          OLD_ABI: ${{ matrix.oldabi }}
        run: |
          set -euo pipefail
          mkdir -p old-apk
          name="Mochy-Music-v8.2.3-xbibz.5-${OLD_ABI}-gms.apk"
          curl -fL --retry 3 -o old-apk/v5.apk "https://github.com/XbibzOfficial777/Mochy-Music/releases/download/v8.2.3-xbibz.5/$name"
          case "$OLD_ABI" in
            arm64-v8a) hash=076ba3846168d7d682a78600f3b39070345edf7a39602eb875dcf4428c836de2 ;;
            armeabi-v7a) hash=f9a09fd4dd70f3768462ee294fe4807a737d6019b7402db6b7b38e0fbd264a43 ;;
            *) exit 1 ;;
          esac
          echo "$hash  old-apk/v5.apk" | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          TARGET_ABI: ${{ matrix.abi }}
          RUNTIME_ABI: ${{ matrix.runtime }}
          OLD_ABI: ${{ matrix.oldabi }}
          EMULATOR_API: ${{ matrix.api }}
          SCENARIO: ${{ inputs.scenario }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: ${{ matrix.emulator_arch }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash -c 'if [ "$SCENARIO" = playback ]; then bash .github/scripts/signed-playback-smoke.sh; elif [ "$SCENARIO" = fixture ]; then adb install -r language-apk/*.apk && echo com.mochyy.mochymusic.debug > smoke-package.txt && bash .github/scripts/smoke-backdrop-only.sh; else bash .github/scripts/dual-abi-smoke.sh; fi'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-motion-${{ inputs.scenario }}-evidence-${{ matrix.abi }}-api-${{ matrix.api }}-${{ matrix.emulator_arch }}
          path: |
            language-*.txt
            language-*.xml
            language-*.png
            smoke-latest-*.xml
            smoke-latest-*.txt
            smoke-latest-*.png
          if-no-files-found: warn
