name: Album order before and after fix
on:
  push:
    branches: [ci/original-album-order-tests]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Build original with regression tests
        run: ./gradlew :app:assembleUniversalFossDebug :app:assembleUniversalFossDebugAndroidTest --no-configuration-cache --console=plain --warning-mode summary
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Show original fails ordering tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-album-tests.sh baseline
      - name: Apply the exact proposed fix
        run: git apply .github/patches/album-order.patch
      - name: Build and lint the fixed original app
        run: ./gradlew :app:assembleUniversalFossDebug :app:assembleUniversalFossDebugAndroidTest :app:lintUniversalFossDebug --no-configuration-cache --console=plain --warning-mode summary
      - name: Verify fixed database queries on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-album-tests.sh fixed
      - name: Verify fixed database queries on Android 8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-album-tests.sh fixed-api26
      - name: Upload fixed debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: album-order-fixed-original-apk
          path: app/build/outputs/apk/universalFoss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: album-order-tests-api35
          path: |
            album-ci-results/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 7
