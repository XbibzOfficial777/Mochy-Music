name: Language UI validation (temporary)
on:
  push:
    branches: [ 'ci/language-ui-validation' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Debug key
        run: |
          mkdir -p ~/.android
          keytool -genkey -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build and run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalGmsDebug :app:testUniversalGmsDebugUnitTest --no-configuration-cache --console=plain --warning-mode summary
      - uses: actions/upload-artifact@v4
        with:
          name: language-debug-apk
          path: app/build/outputs/apk/universalGms/debug/*.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: language-debug-apk
          path: language-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -change-locale id-ID
          script: bash .github/scripts/language-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-evidence-api-${{ matrix.api }}
          path: |
            language-*.txt
            language-*.xml
            language-*.png
          if-no-files-found: warn
