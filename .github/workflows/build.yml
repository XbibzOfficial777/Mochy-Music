name: Original issue fixes validation
on:
  push:
    branches: ['ci/original-latest-validation']
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Build run whose unchanged application sources produced the APK'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Build original debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleUniversalGmsDebug :app:testUniversalGmsDebugUnitTest --no-configuration-cache --console=plain --warning-mode summary
      - uses: actions/upload-artifact@v4
        with:
          name: original-debug-apk
          path: app/build/outputs/apk/universalGms/debug/*.apk
  emulator:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify reused APK matches application sources
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$source_sha^{commit}"
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- . ':(exclude).github/**'
      - uses: actions/download-artifact@v4
        with:
          name: original-debug-apk
          path: smoke-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Original UI regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            apk="$(find smoke-apk -name '*.apk' -type f -print -quit)"
            test -n "$apk"
            build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            package="$("$build_tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
            test -n "$package"
            printf '%s' "$package" > smoke-package.txt
            adb wait-for-device
            adb install -r "$apk"
            adb logcat -c
            bash .github/scripts/smoke-latest.sh
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-latest-evidence-api-${{ matrix.api }}
          path: |
            smoke-latest-*.xml
            smoke-latest-*.png
            smoke-latest-*.txt
          if-no-files-found: warn
