name: CI & Debug Build

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Optional CI run ID whose identical app sources supplied the debug APK'
        required: false
        default: ''
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read
  actions: read

jobs:
  build_debug:
    name: Build Universal GMS Debug
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == '')
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew assembleUniversalGmsDebug --no-configuration-cache --console=plain --warning-mode summary

      - name: Run JVM unit tests
        run: |
          ./gradlew :app:testUniversalGmsDebugUnitTest \
            --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-gms-debug
          path: app/build/outputs/apk/universalGms/debug/*.apk

  smoke_test:
    name: Android emulator launch (API ${{ matrix.api }})
    needs: build_debug
    if: ${{ always() && (needs.build_debug.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify reused APK matches current app sources
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$source_sha^{commit}"
          # Only workflow/test-script changes may differ; all app and build sources must match.
          git diff --exit-code "$source_sha" "$GITHUB_SHA" -- . ':(exclude).github/**'
          echo "Debug APK source $source_sha matches current application sources."
      - uses: actions/download-artifact@v4
        with:
          name: app-universal-gms-debug
          path: smoke-apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Install PNG verification dependency
        run: python3 -m pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash .github/scripts/smoke-launch.sh
            bash .github/scripts/smoke-fixtures.sh
            bash .github/scripts/smoke-latest.sh
      - name: Save smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: |
            smoke-start.txt
            smoke-logcat.txt
            smoke-launch.png
            smoke-*-start.txt
            smoke-ui.xml
            smoke-document-picker.xml
            smoke-fixtures-logcat.txt
            smoke-fixtures-screen.png
            smoke-receipt.png
            smoke-latest-*.xml
            smoke-latest-*.png
            smoke-latest-*.txt
          if-no-files-found: warn
