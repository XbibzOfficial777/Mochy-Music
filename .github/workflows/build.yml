name: Xbibz 8.3.2 FOSS verification
on:
  push:
    branches: [ci/xbibz832-foss-verify]
permissions:
  contents: read
jobs:
  foss:
    name: Build FOSS debug and run JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Build and test
        run: |
          chmod +x gradlew
          mkdir -p ~/.android
          keytool -genkey -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          ./gradlew assembleUniversalFossDebug :app:testUniversalFossDebugUnitTest --no-configuration-cache --console=plain --warning-mode summary
