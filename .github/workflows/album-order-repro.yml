name: Transactional album ordering final UI check
on:
  push:
    branches: [ci/original-album-order-ui-fixed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Download the exact tested original-project debug APK
        uses: actions/download-artifact@v4
        with:
          name: album-order-fixed-original-apk
          path: candidate-apk
          github-token: ${{ github.token }}
          run-id: 42047988456
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | sed -n '1p'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import three synthetic tagged tracks and inspect album
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: false
          script: bash .github/scripts/album-order-repro.sh
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: album-order-final-ui-api-35
          path: album-order-evidence/
          if-no-files-found: warn
          retention-days: 7
