name: Transactional album ordering final UI check
on:
  push:
    branches: [ci/original-album-order-ui-fixed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Build the original app with the final candidate
        run: |
          ./gradlew :app:assembleUniversalFossDebug --no-configuration-cache --console=plain --warning-mode summary
          mkdir -p candidate-apk
          cp app/build/outputs/apk/universalFoss/debug/*.apk candidate-apk/app-universal-foss-debug.apk
      - name: Save the candidate APK
        uses: actions/upload-artifact@v6
        with:
          name: album-order-final-ui-candidate-apk
          path: candidate-apk/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Free build space before installing the emulator
        run: |
          ./gradlew --stop || true
          find . -type d -name build -prune -exec rm -rf {} +
          rm -rf "$HOME/.gradle/caches"
          df -h
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -version | sed -n '1p'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import three synthetic tagged tracks and inspect album
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: false
          script: bash .github/scripts/album-order-repro.sh
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: album-order-final-ui-api-35
          path: album-order-evidence/
          if-no-files-found: warn
          retention-days: 7
