name: Desktop verified build and release

on:
  push:
    branches: [feat/mochi-bibz-desktop]
    tags: ['desktop-v*']
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies and verify the lockfile
        working-directory: desktop
        run: npm ci
      - run: npm run check
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: desktop

  platform:
    name: Verify ${{ matrix.name }}
    needs: source-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            electron-arch: x64
          - name: macOS arm64
            os: macos-15
            platform: darwin
            arch: arm64
            electron-arch: arm64
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
            electron-arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies and verify the lockfile
        working-directory: desktop
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm ci
          else
            npm ci --cpu=${{ matrix.arch }} --os=${{ matrix.platform }}
          fi
        shell: bash
      - name: Install engine
        working-directory: desktop
        run: npm run prepare:engine
      - name: Verify pinned engine checksum
        shell: bash
        working-directory: desktop
        run: |
          case "${{ matrix.platform }}/${{ matrix.arch }}" in
            linux/x64) name=yt-dlp_linux ;;
            linux/arm64) name=yt-dlp_linux_aarch64 ;;
            darwin/x64) name=yt-dlp_macos ;;
            darwin/arm64) name=yt-dlp_macos ;;
            win32/x64) name=yt-dlp.exe ;;
            win32/arm64) name=yt-dlp_arm64.exe ;;
          esac
          expected="$(awk -v target="$name" '$2 == target { print $1 }' ../.github/desktop-yt-dlp.sha256)"
          test -n "$expected"
          url="https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/$name"
          curl --fail --location --silent --show-error "$url" -o expected-engine
          actual="$(sha256sum expected-engine | cut -d' ' -f1)"
          test "$actual" = "$expected"
          rm expected-engine
      - name: Install Playwright Chromium
        working-directory: desktop
        run: npx playwright install chromium --with-deps
        if: matrix.platform == 'linux'
      - name: Install Playwright Chromium
        working-directory: desktop
        run: npx playwright install chromium
        if: matrix.platform != 'linux'
      - name: Prepare a virtual audio sink
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1 --load="module-null-sink sink_name=mochi_test sink_properties=device.description=MochiTest"
          echo "PULSE_SERVER=unix:/run/user/$(id -u)/pulse/native" >> "$GITHUB_ENV"
      - name: Verify real local playback, persistence and UI
        working-directory: desktop
        run: npm run test:desktop
        env:
          CI: 'true'
          DEBUG: pw:browser
      - name: Build installers
        working-directory: desktop
        run: npm run dist -- --${{ matrix.electron-arch }}
        env:
          CI: 'true'
      - name: Verify installer metadata
        shell: bash
        working-directory: desktop
        run: bash ../../.github/scripts/verify-desktop-artifacts.sh dist "${{ matrix.platform }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest*.yml
            desktop/playwright-report/**
            desktop/tests/test-results/**
          if-no-files-found: warn
          retention-days: 14

  online:
    name: Verify online services
    needs: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run prepare:engine
        working-directory: desktop
      - run: npm run test:online || echo '::warning::Online service check failed; local playback remains the release gate.'
        working-directory: desktop
      - name: Verify real YouTube playback in the application
        working-directory: desktop
        run: MOCHI_ONLINE=1 npm run test:desktop -- -g 'online search' || echo '::warning::YouTube playback check failed; online features depend on the external service.'
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-online-results
          path: |
            desktop/online-report.json
            desktop/playwright-report/**
            desktop/tests/test-results/**
          if-no-files-found: warn
          retention-days: 14

  verify-release:
    name: Verify release inputs
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [platform, online]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Match package version to release tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./desktop/package.json').version")"
          test "desktop-v$version" = "$TAG"
          echo "Release tag matches package version $version."

  release:
    name: Publish verified desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [verify-release, platform, online]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*-*
          path: release-assets
          merge-multiple: true
      - name: Discard test reports from published assets
        shell: bash
        run: find release-assets -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
      - name: Reject duplicate installer names
        shell: bash
        run: |
          set -euo pipefail
          for name in *.exe *.dmg *.AppImage *.deb; do
            [[ -f "release-assets/$name" ]] || continue
            count="$(find release-assets -maxdepth 1 -name "$name" | wc -l)"
            test "$count" -eq 1 || { echo "Duplicate installer name: $name" >&2; exit 1; }
          done
      - name: Require installers for all three platforms
        shell: bash
        run: bash .github/scripts/verify-desktop-release-set.sh release-assets "${GITHUB_REF_NAME#desktop-v}"
      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            release-assets/*.exe release-assets/*.exe.blockmap \
            release-assets/*.dmg release-assets/*.zip \
            release-assets/*.AppImage release-assets/*.deb release-assets/SHA256SUMS.txt \
            --verify-tag --title "Mochi Bibz Desktop ${TAG#desktop-v}" \
            --notes "Desktop release built and verified on Linux, macOS and Windows via GitHub Actions. See SHA256SUMS.txt."
