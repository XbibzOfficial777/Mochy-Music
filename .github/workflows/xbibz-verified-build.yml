name: Xbibz verified release build

on:
  push:
    branches:
      - fix/search-motion-release
      - optimize/bibz-uiux-fixes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbibz-verified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests and release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Verify release inputs and native verifier
        run: |
          python3 .github/scripts/check_release_inputs.py
          python3 .github/scripts/test_signature_schemes.py
          python3 .github/scripts/test_release_native.py
          python3 .github/scripts/test_release_artifacts.py
      - name: Run app unit tests
        run: |
          set -euo pipefail
          ./gradlew :app:testUniversalGmsDebugUnitTest -PbuildAbis=universal \
            --no-configuration-cache --no-parallel --max-workers=2 --console=plain --warning-mode=all \
            '-Dorg.gradle.jvmargs=-Xmx5g -XX:+UseParallelGC' \
            -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee unit-tests.log
          python3 .github/scripts/check_build_output.py unit-tests.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            unit-tests.log
            app/build/reports/tests/
            app/build/test-results/

  release:
    name: Signed universal GMS APK · v2 + v4 only
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RELEASE_STORE_TYPE: PKCS12
      STORE_PASSWORD: ${{ secrets.MOCHY_RELEASE_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MOCHY_RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MOCHY_RELEASE_KEY_PASSWORD }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Restore repository release key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOCHY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing repository release keystore}"
          : "${STORE_PASSWORD:?Missing repository store password}"
          : "${KEY_ALIAS:?Missing repository key alias}"
          : "${KEY_PASSWORD:?Missing repository key password}"
          umask 077
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          java tools/VerifyKeystore.java app/keystore/release.keystore "$(cat .github/release-certificate.sha256)"
      - name: Compile optimized release and run lint
        run: |
          set -euo pipefail
          ./gradlew :app:assembleUniversalGmsRelease :app:lintUniversalGmsRelease \
            -PbuildAbis=universal -PcompressNativeLibs --no-configuration-cache --no-parallel \
            --max-workers=2 --console=plain --warning-mode=all \
            '-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC' \
            -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee release-build.log
      - name: Verify and collect signed APK, v4 sidecar and changelog
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/universalGms/release -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify -Werr --verbose --print-certs "$apk" | tee signatures.txt
          java --class-path "$tools/lib/apksigner.jar" tools/VerifyApkSignatures.java \
            "$apk" "$apk.idsig" "$(cat .github/release-certificate.sha256)" | tee -a signatures.txt
          python3 .github/scripts/verify_release_native.py "$apk" universal
          "$tools/aapt" dump badging "$apk" > apk-badging.txt
          if grep -q application-debuggable apk-badging.txt; then
            echo 'Refusing a debuggable release APK' >&2
            exit 1
          fi
          "$tools/zipalign" -c -P 16 4 "$apk"
          version="$(python3 -c 'import json; print(json.load(open("app/src/main/assets/changelog.json"))["versionName"])')"
          grep -q "versionName='$version'" apk-badging.txt
          grep -q "versionCode='81'" apk-badging.txt
          mkdir -p release-assets
          filename="Mochy-Music-v${version}-universal-gms.apk"
          cp "$apk" "release-assets/$filename"
          cp "$apk.idsig" "release-assets/$filename.idsig"
          cp app/src/main/assets/changelog.json release-assets/changelog.json
          cp "release-notes/$version.md" release-assets/CHANGELOG.md
          cp signatures.txt apk-badging.txt release-assets/
          (cd release-assets && sha256sum *.apk *.idsig changelog.json CHANGELOG.md > SHA256SUMS.txt)
      - name: Require clean compiler and lint reports
        run: |
          python3 .github/scripts/check_build_output.py release-build.log
          python3 .github/scripts/check_build_output.py app/build/reports/lint-results-universalGmsRelease.xml --lint
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Mochy-Xbibz-universal-GMS-${{ github.run_number }}
          path: |
            release-assets/
            release-build.log
            app/build/reports/lint-results-universalGmsRelease.*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f app/keystore/release.keystore
